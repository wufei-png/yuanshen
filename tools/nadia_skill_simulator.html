<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="娜蒂娅衡标状态机与 20 秒循环的开发用透明推演器。">
  <title>娜蒂娅｜技能表现开发模拟器</title>
  <style>
    :root {
      --bg: #071426;
      --bg-2: #0d2342;
      --panel: rgba(13, 35, 66, .9);
      --panel-2: rgba(7, 23, 45, .8);
      --line: rgba(164, 222, 247, .24);
      --ink: #eff9ff;
      --muted: #a6bdd3;
      --faint: #7796b2;
      --ice: #9be8ff;
      --light: #83e7ff;
      --heavy: #f1c978;
      --zero: #f1f5ff;
      --danger: #ffb69e;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 0%, rgba(78, 183, 223, .2), transparent 29rem),
        linear-gradient(145deg, var(--bg) 0%, var(--bg-2) 58%, #071527 100%);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }
    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto; }
    header { padding: 34px 0 24px; border-bottom: 1px solid var(--line); }
    .header-line { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
    .eyebrow { color: var(--ice); font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1, h2, h3 { margin: 0; font-family: Georgia, "Songti SC", "STSong", serif; font-weight: 500; line-height: 1.2; }
    h1 { margin-top: 9px; font-size: clamp(30px, 5vw, 55px); }
    h2 { font-size: 28px; }
    h3 { font-size: 19px; }
    p { margin: 0; }
    .header-note { max-width: 410px; color: var(--muted); font-size: 12px; text-align: right; }
    .badge { display: inline-flex; margin-top: 12px; padding: 4px 9px; border: 1px solid rgba(241, 201, 120, .5); border-radius: 999px; color: var(--heavy); font-size: 10px; letter-spacing: .08em; }
    main { padding: 30px 0 70px; }
    .notice { margin-bottom: 22px; padding: 15px 18px; border-left: 2px solid var(--heavy); background: rgba(40, 39, 34, .45); color: #d8e4ed; font-size: 12px; }
    .notice strong { color: var(--heavy); }
    .workbench { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 18px 50px rgba(0, 4, 16, .22); }
    .controls { padding: 22px; position: sticky; top: 18px; }
    .panel-label { margin-bottom: 10px; color: var(--ice); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .controls h2 { margin-bottom: 7px; }
    .controls > p { margin-bottom: 20px; color: var(--muted); font-size: 12px; }
    .field { display: grid; gap: 6px; margin-top: 15px; }
    .field label { color: #d9edf7; font-size: 12px; }
    .field small { color: var(--faint); font-size: 10px; }
    input[type="number"] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(4, 16, 33, .8); color: var(--ink); font: inherit; font-size: 12px; }
    .checkbox-line { display: flex; align-items: center; gap: 9px; margin-top: 17px; color: #d9edf7; font-size: 12px; }
    input[type="checkbox"] { accent-color: var(--ice); }
    .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 21px; }
    button { min-height: 38px; padding: 7px 9px; border: 1px solid rgba(155, 232, 255, .34); border-radius: 8px; background: rgba(5, 22, 43, .86); color: #e9f8ff; font: inherit; font-size: 11px; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--ice); color: var(--ice); }
    button.primary { border-color: var(--ice); background: rgba(78, 183, 223, .2); }
    button.reset { border-color: rgba(255, 182, 158, .45); color: var(--danger); }
    .preset-title { margin: 26px 0 9px; color: var(--gold, #e6c77c); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .preset-grid { display: grid; gap: 8px; }
    .preset-grid button { text-align: left; }
    .state-panel { min-width: 0; padding: 24px; }
    .state-top { display: flex; align-items: start; justify-content: space-between; gap: 20px; }
    .state-top p { color: var(--muted); font-size: 12px; }
    .clock { color: var(--gold, #e6c77c); font-family: Georgia, serif; font-size: 31px; white-space: nowrap; }
    .clock small { display: block; color: var(--faint); font-family: inherit; font-size: 10px; letter-spacing: .12em; text-align: right; text-transform: uppercase; }
    .h-wrap { margin: 28px 0 20px; padding: 20px; border: 1px solid rgba(155, 232, 255, .16); border-radius: 13px; background: rgba(4, 17, 35, .62); }
    .h-labels { display: flex; justify-content: space-between; color: var(--faint); font-size: 10px; }
    .h-rail { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 10px; }
    .h-cell { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--line); border-radius: 11px; background: rgba(7, 25, 48, .66); color: var(--faint); transition: .18s ease; }
    .h-cell strong { font-family: Georgia, serif; font-size: 24px; font-weight: 500; }
    .h-cell span { font-size: 10px; }
    .h-cell.active { border-color: var(--ice); background: rgba(155, 232, 255, .13); color: var(--zero); box-shadow: 0 0 0 2px rgba(155, 232, 255, .13), inset 0 -3px 0 var(--ice); }
    .h-cell[data-h="-2"], .h-cell[data-h="-1"] { --cell-color: var(--light); }
    .h-cell[data-h="1"], .h-cell[data-h="2"] { --cell-color: var(--heavy); }
    .h-cell.active[data-h="-2"], .h-cell.active[data-h="-1"] { border-color: var(--light); color: var(--light); box-shadow: 0 0 0 2px rgba(131, 231, 255, .12), inset 0 -3px 0 var(--light); }
    .h-cell.active[data-h="1"], .h-cell.active[data-h="2"] { border-color: var(--heavy); color: var(--heavy); box-shadow: 0 0 0 2px rgba(241, 201, 120, .12), inset 0 -3px 0 var(--heavy); }
    .status-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: #d9edf7; font-size: 12px; }
    .status-line strong { color: var(--ice); }
    .status-line span { color: var(--muted); }
    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px; }
    .metric { min-height: 88px; padding: 13px; border: 1px solid rgba(155, 232, 255, .15); border-radius: 11px; background: rgba(7, 24, 46, .52); }
    .metric-label { color: var(--faint); font-size: 10px; }
    .metric-value { display: block; margin-top: 7px; color: var(--ink); font-family: Georgia, serif; font-size: 23px; }
    .metric-value small { color: var(--muted); font-family: inherit; font-size: 11px; }
    .metric-note { margin-top: 3px; color: var(--faint); font-size: 9px; }
    .log-panel { margin-top: 18px; padding: 20px; }
    .log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 12px; }
    .log-head p { color: var(--muted); font-size: 11px; }
    .event-log { max-height: 360px; margin: 0; padding: 0; overflow: auto; list-style: none; }
    .event-log li { display: grid; grid-template-columns: 70px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(155, 232, 255, .1); color: var(--muted); font-size: 11px; }
    .event-log time { color: var(--ice); font-variant-numeric: tabular-nums; }
    .event-log li[data-kind="reject"] { color: var(--danger); }
    .event-log li[data-kind="state"] { color: #e2eef5; }
    .contract { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
    .contract .panel { padding: 22px; }
    .contract h2 { margin-bottom: 10px; font-size: 24px; }
    .contract p, .contract li { color: var(--muted); font-size: 12px; }
    .contract ul { margin: 0; padding-left: 18px; }
    .contract li + li { margin-top: 6px; }
    code { padding: 1px 4px; border-radius: 4px; background: rgba(155, 232, 255, .1); color: var(--ice); font-size: .95em; }
    footer { padding: 0 0 34px; color: var(--faint); font-size: 11px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    @media (max-width: 920px) { .workbench { grid-template-columns: 1fr; } .controls { position: static; } .contract { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .wrap { width: min(100% - 24px, 560px); } .header-line, .state-top { flex-direction: column; } .header-note { text-align: left; } .clock small { text-align: left; } .metric-grid { grid-template-columns: repeat(2, 1fr); } .h-rail { gap: 4px; } .h-cell { min-height: 70px; } .h-cell strong { font-size: 20px; } }
  </style>
</head>
<body>
  <header class="wrap"><p class="eyebrow">NADIA / DESIGN LAB V3</p><h1>衡标 H · 稳定星反应辅助</h1><p>开发工具：原生反应由外部输入，不计算整队DPS。零命非专武基础完整；归衡提高上限。</p><p><a href="../output/nadia_character/gameplay.html">阅读完整玩法规格</a></p></header>
  <main class="wrap">
    <section class="panel"><h2>构筑与动作</h2>
      <label>命座 <select id="constellation"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label>
      <label>充能% <input id="er" type="number" min="100" value="180"></label>
      <label>初始能量 <input id="energy" type="number" min="0" max="50" value="50"></label>
      <label><input id="weapon" type="checkbox">专武R1</label><label><input id="artifact" type="checkbox">炉心4件</label>
      <button id="reset">应用构筑并重置</button>
      <p>动作会让娜蒂娅上场；切队友后，自产球按四人单人队的后台接取假设计能量。</p>
      <div class="controls">
        <button data-action="skill">E短按 / 校读 / 续开</button><button data-action="hold">E长按 / 切路</button>
        <button data-action="burst">Q</button><button data-action="off">切队友</button>
        <button data-action="swirl">输入星扩散（后台队友）</button><button data-action="conduct">输入星超导（后台队友）</button>
        <button data-action="damage">输入直接伤害（不写H）</button><button data-action="leave">死亡 / 离队</button>
      </div>
      <p><label>前进秒数 <input id="step" type="number" min="0" step="0.5" value="2.5"></label><button id="advance">前进时间</button></p>
      <p><button data-action="target-out">目标离开范围</button><button data-action="target-in">新敌人进入范围</button>
      <label>外部基础能量 <input id="external" type="number" min="0" value="12"></label><button id="add-energy">输入回能</button></p>
      <p><button data-preset="light">轻端20秒</button><button data-preset="heavy">重端20秒</button><button data-preset="mixed">混合反应20秒</button><button data-preset="noq">不开Q20秒</button><button data-preset="none">无反应20秒</button></p>
      <p id="error" role="alert"></p>
    </section>
    <section class="panel" aria-live="polite"><h2 id="state">归衡位置</h2>
      <p id="buffs"></p><p id="timers"></p><p id="numbers"></p><p id="coverage"></p>
      <p>系数不含暴击、抗性、原生场地倍率和队友伤害；三类系数不能相加作为伤害。擢升、装备及个人充能转伤单列，不混入原始系数。</p>
    </section>
    <section class="panel"><h2>事件日志</h2><ol id="events"></ol></section>
  </main>
  <style>
    .panel {padding:24px; margin:20px 0; border:1px solid #48677d; border-radius:16px; background:#10273b;}
    label {display:inline-block; margin:6px 12px 6px 0;} input[type=number] {width:90px;}
    button, select, input {font:inherit; padding:8px; border-radius:6px;} button {cursor:pointer; margin:4px;}
    #events {max-height:620px; overflow:auto;} #events li {padding:6px 0; overflow-wrap:anywhere;}
    #error {color:#ffb1a8;} .wrap {max-width:1100px; margin:auto; padding:20px;}
    body {background:#081624; color:#e9f4fa; font-family:system-ui,sans-serif; line-height:1.7;} a {color:#92e0ff;}
  </style>
  <script src="nadia_simulator_core.js"></script>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      let sim;
      let target = 1;
      function reset() {
        sim = NadiaRules.create({constellation:Number($('constellation').value),er:Number($('er').value),energy:Number($('energy').value),weapon:$('weapon').checked,artifact:$('artifact').checked});
        render();
      }
      function render() {
        const s=sim.snapshot(), f=s.effects;
        $('state').textContent=`${s.time.toFixed(2)}秒 · ${s.mode==='light'?'轻端':'重端'} · H ${s.h} · 成长${s.growth}/2 · ${s.onField?'娜蒂娅前台':'队友前台'}`;
        $('buffs').textContent=`角色星反应增伤 ${f.characterBonus}% · 擢升 ${f.elevation}% · 减抗 冰${f.shred.cryo}/风${f.shred.anemo}/雷${f.shred.electro}% · 受到的削韧降低 ${f.poiseDamageTakenReduction}%`;
        $('timers').textContent=`巡衡剩余 ${Math.max(0,s.patrolUntil-s.time).toFixed(1)}秒 · 测区 ${Math.max(0,s.zeroUntil-s.time).toFixed(1)}秒 · 专武团队 ${f.weaponTeamBonus}% · 炉心 ${f.artifactTeamBonus}% · 个人充能转伤 ${f.personalErBonus.toFixed(2)}%`;
        $('numbers').textContent=`普通冰系数 ${s.coefficients.ordinary.toFixed(2)}% · 直接星扩散 ${s.coefficients.swirl.toFixed(2)}% · 直接星超导 ${s.coefficients.conduct.toFixed(2)}% · 能量 ${s.energy.toFixed(2)}/50 · 微粒 ${s.metrics.particles} · 附着 ${s.metrics.applications}`;
        $('coverage').textContent=`巡衡 ${s.metrics.patrolSeconds.toFixed(2)}秒 · 减抗 冰${s.metrics.cryoShredSeconds.toFixed(2)}/风${s.metrics.anemoShredSeconds.toFixed(2)}/雷${s.metrics.electroShredSeconds.toFixed(2)}秒 · 校准 ${s.metrics.calibrationSeconds.toFixed(2)}秒 · 时间平均角色增伤 ${(s.time?s.metrics.bonusIntegral/s.time:0).toFixed(2)}% · 普通/完整归衡 ${s.metrics.normal}/${s.metrics.full}`;
        $('events').replaceChildren(...s.events.slice(-100).reverse().map(e=>{const li=document.createElement('li');li.textContent=`${e.time.toFixed(2)}s ${e.text}`;return li;}));
        window.NadiaSimulator=sim;
      }
      function perform(fn) {try {$('error').textContent='';fn();render();} catch(e){$('error').textContent=e.message;}}
      const actions={skill:()=>sim.castSkill(),hold:()=>sim.castSkill(true),burst:()=>sim.burst(),off:()=>sim.setOnField(false),
        swirl:()=>sim.reaction('swirl',{onField:false}),conduct:()=>sim.reaction('conduct',{onField:false}),
        damage:()=>sim.reaction('swirl',{kind:'damage'}),leave:()=>sim.leave(),
        'target-out':()=>sim.setTarget(false),'target-in':()=>sim.setTarget(true,`enemy-${++target}`)};
      document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>perform(actions[b.dataset.action])));
      document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>perform(()=>{
        reset();const name=b.dataset.preset;sim.castSkill(name==='heavy');sim.setOnField(false);
        const at=(t,fn)=>{sim.advance(t-sim.snapshot().time);fn();};
        if(name!=='none') {
          [2.5,5,8,10.5,14,16.5,19].forEach((t,i)=>{
            at(t,()=>sim.reaction(name==='heavy'||name==='mixed'&&i%2?'conduct':'swirl',{onField:false}));
            if(t===5&&!['noq'].includes(name))at(5.5,()=>{sim.burst();sim.setOnField(false);});
            if(t===10.5&&!['noq'].includes(name))at(11.5,()=>{sim.recastSkill();sim.setOnField(false);});
          });
        }
        sim.advance(20-sim.snapshot().time);
      })));
      $('reset').addEventListener('click',()=>perform(reset));
      $('advance').addEventListener('click',()=>perform(()=>sim.advance(Number($('step').value))));
      $('add-energy').addEventListener('click',()=>perform(()=>sim.externalEnergy(Number($('external').value))));
      reset();
    })();
  </script>
</body>
</html>
