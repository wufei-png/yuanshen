name: Simulator tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: simulator-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-simulator-tests:
    name: Node simulator regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"

      - name: Run simulator regression tests
        run: node tools/test_nadia_simulator.cjs
